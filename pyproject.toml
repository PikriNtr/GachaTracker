[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gachatracker"
version = "0.6.0"
description = "A modular, multi-game gacha history tracker and analytics framework for Discord."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "discord.py[voice]>=2.4.0",
    "python-dotenv>=1.0.1",
    "pynacl>=1.5.0",
    "davey>=0.1.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
