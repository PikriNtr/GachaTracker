[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gachatracker"
version = "0.6.0"
description = "A modular, multi-game gacha history tracker and analytics framework for Discord."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "discord.py[voice]>=2.4.0",
    "python-dotenv>=1.0.1",
    "pynacl>=1.5.0",
    "davey>=0.1.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conservative set: real errors (E/F), import order (I), bug patterns (B).
# Deliberately NOT enabled: UP (style churn), BLE/S1 (broad excepts are
# intentional at Discord command boundaries and API retry paths),
# DTZ (gacha timestamps are game-server local strings by design).
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "B011"]
# FastAPI's dependency-injection idiom requires Depends() in parameter defaults.
"api/*" = ["B008"]
